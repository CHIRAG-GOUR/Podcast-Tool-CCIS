# https://github.com/firebase/firebase-tools

name: Deploy to Firebase Hosting on merge
on:
  push:
    branches:
      - podcast_tool
  workflow_dispatch:
jobs:
  build_and_deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Create .env file
        run: |
          echo "GEMINI_API_KEY=${{ secrets.GEMINI_API_KEY }}" >> .env
          echo "ADMIN_FIREBASE_PROJECT_ID=${{ secrets.ADMIN_FIREBASE_PROJECT_ID }}" >> .env
          echo "ADMIN_FIREBASE_CLIENT_EMAIL=${{ secrets.ADMIN_FIREBASE_CLIENT_EMAIL }}" >> .env
          echo "ADMIN_FIREBASE_STORAGE_BUCKET=${{ secrets.ADMIN_FIREBASE_STORAGE_BUCKET }}" >> .env
          echo 'ADMIN_FIREBASE_PRIVATE_KEY="${{ secrets.ADMIN_FIREBASE_PRIVATE_KEY }}"' >> .env
          echo "API_SECRET_TOKEN=${{ secrets.API_SECRET_TOKEN }}" >> .env
          echo "NEXT_PUBLIC_API_SECRET_TOKEN=${{ secrets.NEXT_PUBLIC_API_SECRET_TOKEN }}" >> .env
      - run: npm ci && npm run build
      - run: rm -rf .next/cache
      - uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_SKILLIZEE_PRODUCTS }}
          channelId: live
          projectId: skillizee-products
        env:
          FIREBASE_CLI_EXPERIMENTS: webframeworks
